<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>*.❅•𝐌𝐞𝐫𝐫𝐲 𝐂𝐡𝐫𝐢𝐬𝐭𝐦𝐚𝐬ॱ❆.*</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas { display: block; }
  .title {
    position: fixed;
    left: 40px;
    top: 33%;
    color: #fff;
    font-family: "Cambria Math", "Segoe UI", "Segoe Script", "Brush Script MT", cursive;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 45px);
    letter-spacing: 1px;
    line-height: 1.4;
    max-width: 62vw;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 0 24px rgba(255, 220, 230, 0.35);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="title">*.❅•𝐌𝐞𝐫𝐫𝐲 𝐂𝐡𝐫𝐢𝐬𝐭𝐦𝐚𝐬ॱ❆.*</div>

<script>
(function () {
  // ================== 全局参数（移植自 tree.py） ==================
  var BLACK = "#000";
  var TREE_HEIGHT = 12.0;
  var SCALE = 0.72;
  var CAM_DIST = 13;
  var CAM_HEIGHT = 6.0;
  var PITCH = -0.25;
  var TAU = Math.PI * 2;

  // 粒子数量（为浏览器流畅度按比例缩减，视觉结构保持一致）
  var TREE_POINTS = 16000;
  var GROUND_POINTS = 1200;
  var STAR_POINTS = 400;
  var HEART_POINTS = 300;
  var SNOW2D_POINTS = 10;

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function gauss(mu, sigma) {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }
  function rgb(r, g, b) {
    r = Math.max(0, Math.min(255, Math.round(r)));
    g = Math.max(0, Math.min(255, Math.round(g)));
    b = Math.max(0, Math.min(255, Math.round(b)));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  // ================== 生成圣诞树粒子 ==================
  function genTreePoints() {
    var pts = [];
    var loops = 9;
    var spiralN = Math.floor(TREE_POINTS * 0.7);

    // 70% 螺旋灯带
    for (var i = 0; i < spiralN; i++) {
      var u = Math.random();
      var h = Math.pow(u, 1.6);
      var y = TREE_HEIGHT * h + 0.2;
      var baseR = Math.pow(1 - h, 1.1) * 3.2;
      var branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * branchWave;
      var t = u * loops * TAU;
      var angle = t + rand(-0.22, 0.22);
      var r = baseR * rand(0.85, 1.08);
      var x = Math.cos(angle) * r;
      var z = Math.sin(angle) * r;

      var midBoost = 1.0 - Math.abs(h - 0.55) * 1.5;
      midBoost = Math.max(0.15, midBoost);
      var baseG = 155 + 90 * midBoost;
      var baseB = 185 + 70 * midBoost;
      var color;
      if (Math.random() < 0.08) {
        color = rgb(255, 255 - randInt(0, 35), 230 + randInt(0, 25));
      } else {
        color = rgb(255, baseG + randInt(-15, 20), baseB + randInt(-15, 35));
      }
      pts.push([x, y, z, color]);
    }

    // 30% 随机填充，轮廓毛茸茸
    var fillN = TREE_POINTS - spiralN;
    for (var j = 0; j < fillN; j++) {
      var hf = Math.pow(Math.random(), 1.9);
      var yf = TREE_HEIGHT * hf + 0.2 + rand(-0.08, 0.08);
      var baseRf = Math.pow(1 - hf, 1.1) * 4.3;
      var bw = Math.max(0, Math.sin((hf * 5.8 + 0.15) * TAU));
      baseRf *= 1.0 + 0.65 * bw;
      var rf = baseRf * Math.sqrt(Math.random());
      var af = Math.random() * TAU;
      var xf = Math.cos(af) * rf + rand(-0.08, 0.08);
      var zf = Math.sin(af) * rf + rand(-0.08, 0.08);
      var colorF = rgb(255, randInt(165, 225), randInt(190, 250));
      pts.push([xf, yf, zf, colorF]);
    }
    return pts;
  }

  // ================== 地面光环 ==================
  function genGroundPoints() {
    var pts = [];
    var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    for (var i = 0; i < GROUND_POINTS; i++) {
      var ring = rings[Math.floor(Math.random() * rings.length)];
      var r = gauss(ring, 0.3);
      var theta = Math.random() * TAU;
      var x = Math.cos(theta) * r;
      var z = Math.sin(theta) * r;
      var y = -0.25;
      var c = Math.random() < 0.15 ? randInt(235, 255) : randInt(190, 235);
      pts.push([x, y, z, rgb(c, c, 255)]);
    }
    return pts;
  }

  // ================== 空中 3D 小亮点 ==================
  function genStarPoints() {
    var pts = [];
    for (var i = 0; i < STAR_POINTS; i++) {
      var x = rand(-18, 18);
      var z = rand(-18, 18);
      var y = rand(3, 18);
      var base = randInt(215, 255);
      pts.push([x, y, z, rgb(base, base, 255)]);
    }
    return pts;
  }

  // ================== 树顶 3D 爱心 ==================
  function genHeartPoints() {
    var pts = [];
    var scale = 0.9;
    var topY = TREE_HEIGHT + 0.05;
    while (pts.length < HEART_POINTS) {
      var x = rand(-1.3, 1.3);
      var y = rand(-1.4, 1.4);
      var f = Math.pow(x * x + y * y - 1.0, 3) - x * x * Math.pow(y, 3);
      if (f <= 0.0) {
        var wx = x * scale * 0.8;
        var wy = topY + (y + 1.0) * scale * 0.5;
        var wz = rand(-0.18, 0.18);
        var dist = Math.hypot(x, y);
        var factor = Math.max(0.35, 1.15 - 0.5 * dist);
        var g = Math.max(120, Math.min(255, 130 * factor + 80));
        var b = Math.max(120, Math.min(255, 190 * factor + 70));
        pts.push([wx, wy, wz, rgb(255, g, b)]);
      }
    }
    return pts;
  }

  // ================== 前景 2D 大雪花 ==================
  function makeFlake() {
    var y = rand(-80, -10);
    var speed = rand(30, 45);
    var travel = H + 80 - y;
    var life = travel / speed;
    return {
      x: rand(0, W),
      y: y,
      r: rand(10, 16),
      speed: speed,
      life: life,
      maxLife: life
    };
  }
  function respawnFlake(f) {
    var n = makeFlake();
    f.x = n.x; f.y = n.y; f.r = n.r; f.speed = n.speed;
    f.life = n.life; f.maxLife = n.maxLife;
  }

  // ================== 3D -> 2D 投影（俯视） ==================
  function projectPoint(x, y, z, angle) {
    x *= SCALE; y *= SCALE; z *= SCALE;
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    var xz = x * cosA - z * sinA;
    var zz = x * sinA + z * cosA;
    var cosP = Math.cos(PITCH), sinP = Math.sin(PITCH);
    var yp = y * cosP - zz * sinP;
    var zp = y * sinP + zz * cosP;
    zp = zp + CAM_DIST;
    yp = yp - CAM_HEIGHT;
    if (zp <= 0.1) return null;
    var f = (H * 0.63) / zp;
    var sx = W / 2 + xz * f;
    var sy = H / 2 - yp * f;
    return [sx, sy, zp];
  }

  // ================== 初始化 ==================
  var tree = genTreePoints();
  var ground = genGroundPoints();
  var stars = genStarPoints();
  var heart = genHeartPoints();
  var snow2d = [];
  var angle = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener("resize", resize);

  for (var i = 0; i < SNOW2D_POINTS; i++) snow2d.push(makeFlake());

  // ================== 主循环 ==================
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    // 雪花更新
    for (var s = 0; s < snow2d.length; s++) {
      var fl = snow2d[s];
      fl.y += fl.speed * dt;
      fl.life -= dt;
      if (fl.life <= 0 || fl.y > H + 50) respawnFlake(fl);
    }

    // 3D 粒子投影 + 深度排序（远 -> 近）
    var drawList = [];
    var all = tree.concat(ground, stars, heart);
    for (var p = 0; p < all.length; p++) {
      var pt = all[p];
      var proj = projectPoint(pt[0], pt[1], pt[2], angle);
      if (proj) {
        var size = Math.max(1, 3.6 - proj[2] * 0.13);
        drawList.push([proj[2], proj[0], proj[1], size, pt[3]]);
      }
    }
    drawList.sort(function (a, b) { return b[0] - a[0]; });

    for (var d = 0; d < drawList.length; d++) {
      var item = drawList[d];
      var sx = item[1], sy = item[2], size = item[3];
      if (sx >= 0 && sx < W && sy >= 0 && sy < H) {
        ctx.fillStyle = item[4];
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, TAU);
        ctx.fill();
      }
    }

    // 前景大雪花（分层光晕）
    for (var k = 0; k < snow2d.length; k++) {
      var fl2 = snow2d[k];
      if (fl2.maxLife <= 0) continue;
      var phase = fl2.life / fl2.maxLife;
      var alpha = phase > 0.3 ? 255 : Math.max(0, 255 * (phase / 0.3));
      var cx = fl2.x, cy = fl2.y;
      var layers = [
        [fl2.r * 1.3, alpha / 20],
        [fl2.r * 1.0, alpha / 12],
        [fl2.r * 0.75, alpha / 6],
        [fl2.r * 0.55, alpha / 3],
        [fl2.r * 0.45, alpha]
      ];
      for (var l = 0; l < layers.length; l++) {
        if (layers[l][1] <= 0) continue;
        ctx.fillStyle = "rgba(255,255,255," + (layers[l][1] / 255).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(1, layers[l][0]), 0, TAU);
        ctx.fill();
      }
    }

    angle += 0.0045 * dt * 60;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
